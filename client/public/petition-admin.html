<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Signatures — accès réservé</title>
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#111}
input,button{font:inherit;padding:10px 12px;border:1px solid #bbb;border-radius:8px}button{background:#111;color:#fff;cursor:pointer}
table{border-collapse:collapse;width:100%;margin-top:16px;font-size:14px}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap}#err{color:#b00020}</style></head><body>
<h1>Signatures de la pétition</h1>
<p>Accès réservé. Entrez le mot de passe d'administration (variable <code>PETITION_ADMIN_TOKEN</code> du serveur).</p>
<div class="row"><input id="tok" type="password" placeholder="Mot de passe" autocomplete="off"><button id="go">Afficher</button><button id="csv" hidden>Télécharger en CSV</button></div>
<p id="err"></p><p id="count"></p><div id="out"></div>
<script>
var rows=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
document.getElementById("go").onclick=async function(){
  var err=document.getElementById("err");err.textContent="";
  try{
    var r=await fetch("/api/petitions/oiseaux/signatures",{headers:{"x-admin-token":document.getElementById("tok").value}});
    if(!r.ok)throw new Error(r.status===403?"Mot de passe incorrect.":"Erreur "+r.status);
    var d=await r.json();rows=d.signatures;
    document.getElementById("count").textContent=d.count+" signature(s)";
    document.getElementById("csv").hidden=false;
    document.getElementById("out").innerHTML="<table><tr><th>Date</th><th>Nom</th><th>Prénom</th><th>Logement</th><th>E-mail</th></tr>"+
      rows.map(function(x){return"<tr><td>"+esc(x.created_at.slice(0,16).replace("T"," "))+"</td><td>"+esc(x.nom)+"</td><td>"+esc(x.prenom)+"</td><td>"+esc(x.logement)+"</td><td>"+esc(x.email)+"</td></tr>"}).join("")+"</table>";
  }catch(e){err.textContent=e.message}
};
document.getElementById("csv").onclick=function(){
  function q(v){v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'}
  var csv="Date;Nom;Prénom;Logement;E-mail\n"+rows.map(function(x){return[x.created_at,x.nom,x.prenom,x.logement,x.email].map(q).join(";")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));
  a.download="signatures-petition-oiseaux.csv";document.body.appendChild(a);a.click();a.remove();
};
</script></body></html>
