# Blueprint Render : un seul service Node qui sert à la fois l'API et le site
# (le serveur Express sert les fichiers statiques du client une fois buildé —
# voir server/src/app.js). Évite tout problème de proxy entre deux services.
#
# ⚠️ Plan gratuit actif : PAS de disque persistant (non supporté par Render en
# free). La base SQLite, les fichiers uploadés et les sauvegardes vivent sur le
# système de fichiers éphémère du conteneur — tout est effacé à chaque
# redéploiement. Convient à une démonstration, pas à de vrais résidents avec de
# vraies données. Pour passer en persistant sans frais Render (le compte n'a
# pas de budget pour l'instant), voir la piste "base de données externe
# gratuite (Turso)" discutée avec l'utilisateur — sinon, dès qu'un budget est
# disponible, décommenter le bloc `disk` ci-dessous et passer `plan` à
# `starter` (~7$/mois) réactive tout de suite DB_PATH/UPLOADS_DIR/BACKUPS_DIR
# dans les variables d'environnement (retirées ci-dessous pour éviter un crash
# au démarrage tant qu'aucun disque n'est monté sur /data).
#
# disk:
#   name: residence-ops-data
#   mountPath: /data
#   sizeGB: 1
#
# Utilisation : sur render.com, "New +" → "Blueprint" → connecter ce dépôt GitHub.
#
# CORS : ALLOWED_ORIGIN doit être l'URL publique exacte du site une fois connue
# (ex. https://residence-ops.onrender.com, ou un nom de domaine personnalisé) —
# sans ça l'API refuse les requêtes du navigateur en production.

services:
  - type: web
    name: residence-ops
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=client
    startCommand: npm run start:prod --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      # - key: DB_PATH          # Décommenter avec le disque (ex: /data/data.sqlite)
      # - key: UPLOADS_DIR      # Décommenter avec le disque (ex: /data/uploads)
      # - key: BACKUPS_DIR      # Décommenter avec le disque (ex: /data/backups)
      - key: ALLOWED_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:contact@residence-ops.fr
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Résidence Ops <no-reply@residence-ops.fr>"
