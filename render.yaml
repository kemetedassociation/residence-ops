# Blueprint Render : un seul service Node qui sert à la fois l'API et le site
# (le serveur Express sert les fichiers statiques du client une fois buildé —
# voir server/src/app.js). Évite tout problème de proxy entre deux services.
#
# ⚠️ Plan gratuit actif : PAS de disque persistant (non supporté par Render en
# free). Le disque local est effacé à chaque redéploiement — mais la base est
# sauvegardée chaque jour (chiffrée) vers un dépôt GitHub privé DÉDIÉ (jamais
# le dépôt de code, qui peut être public), et restaurée automatiquement au
# démarrage si le disque local est vide (voir server/src/db/restore.js et
# server/src/db/backup.js). Fenêtre de perte de données possible : jusqu'à 24h
# entre deux sauvegardes en cas de crash, mais plus de perte totale à chaque
# redéploiement.
#
# Dès qu'un budget est disponible, décommenter le bloc `disk` ci-dessous et
# passer `plan` à `starter` (~7$/mois) pour un disque persistant en temps réel
# (aucune fenêtre de perte) — réactiver alors aussi DB_PATH/UPLOADS_DIR/
# BACKUPS_DIR (retirées ci-dessous pour éviter un crash au démarrage tant
# qu'aucun disque n'est monté sur /data).
#
# disk:
#   name: residence-ops-data
#   mountPath: /data
#   sizeGB: 1
#
# Utilisation : sur render.com, "New +" → "Blueprint" → connecter ce dépôt GitHub.
#
# CORS : ALLOWED_ORIGIN doit être l'URL publique exacte du site une fois connue
# (ex. https://residence-ops.onrender.com, ou un nom de domaine personnalisé) —
# sans ça l'API refuse les requêtes du navigateur en production.

services:
  - type: web
    name: residence-ops
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=client
    startCommand: npm run start:prod --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      # - key: DB_PATH          # Décommenter avec le disque (ex: /data/data.sqlite)
      # - key: UPLOADS_DIR      # Décommenter avec le disque (ex: /data/uploads)
      # - key: BACKUPS_DIR      # Décommenter avec le disque (ex: /data/backups)
      - key: ALLOWED_ORIGIN
        sync: false
      # Sauvegarde chiffrée vers un dépôt GitHub privé dédié (jamais le dépôt de code) :
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: GITHUB_BACKUP_TOKEN
        sync: false
      - key: GITHUB_BACKUP_REPO
        sync: false
      # Passage en usage réel (voir docs/mise-en-production.md) : SEED_MODE=production crée une
      # vraie résidence + un gestionnaire au lieu des comptes de démonstration (manager123...).
      # - key: SEED_MODE
      #   value: production
      # - key: INITIAL_RESIDENCE_NAME
      #   sync: false
      # - key: INITIAL_MANAGER_EMAIL
      #   sync: false
      # - key: INITIAL_MANAGER_PASSWORD
      #   sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:contact@residence-ops.fr
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Résidence Ops <no-reply@residence-ops.fr>"
